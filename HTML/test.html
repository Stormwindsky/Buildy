<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Model Viewer - Editor</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0a0a1a; font-family: 'Segoe UI', sans-serif; }
        #ui {
            position: absolute; top: 15px; left: 15px;
            background: rgba(0, 0, 0, 0.85); padding: 20px;
            border-radius: 8px; color: white; z-index: 10;
            border: 1px solid #00d4ff; width: 300px;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }
        h2 { margin: 0 0 10px 0; color: #00d4ff; font-size: 18px; letter-spacing: 1px; }
        .controls-hint { font-size: 12px; line-height: 1.6; color: #ccc; margin-top: 15px; border-top: 1px solid #333; padding-top: 10px; }
        b { color: #00d4ff; }
        input[type="file"] { 
            margin-top: 10px; width: 100%; color: #00d4ff; font-size: 12px; cursor: pointer;
            background: #111; padding: 8px; border: 1px dashed #00d4ff; border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h2>MODEL VIEWER</h2>
        <div id="fileSection">
            <label style="font-size: 13px;">Importer un fichier (.rbxmx, .tdw) :</label>
            <input type="file" id="fileInput" accept=".rbxmx,.tdw">
        </div>
        <div class="controls-hint">
            <b>Clic Gauche</b> : Pivoter l'objet<br>
            <b>Clic Droit / Flèches</b> : Panoramique<br>
            <b>Molette</b> : Zoom avant/arrière
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05050f);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
        camera.position.set(50, 50, 50);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(100, 200, 100);
        scene.add(sun);
        scene.add(new THREE.GridHelper(1000, 100, 0x00d4ff, 0x222222));

        const modelGroup = new THREE.Group();
        scene.add(modelGroup);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                modelGroup.clear();
                if (file.name.endsWith('.rbxmx')) parseRoblox(ev.target.result);
                else if (file.name.endsWith('.tdw')) parseTDW(ev.target.result);
                focusModel();
            };
            reader.readAsText(file);
        });

        function parseRoblox(data) {
            const xml = new DOMParser().parseFromString(data, "text/xml");
            Array.from(xml.getElementsByTagName("Item")).forEach(item => {
                if (["Part", "SpawnLocation", "WedgePart"].includes(item.getAttribute("class"))) {
                    const props = item.getElementsByTagName("Properties")[0];
                    const size = props.querySelector('Vector3[name="size"]');
                    const cf = props.querySelector('CoordinateFrame[name="CFrame"]');
                    if(!size || !cf) return;
                    const mesh = new THREE.Mesh(
                        new THREE.BoxGeometry(parseFloat(size.querySelector('X').textContent), parseFloat(size.querySelector('Y').textContent), parseFloat(size.querySelector('Z').textContent)),
                        new THREE.MeshStandardMaterial({ color: (props.querySelector('Color3uint8')?.textContent & 0xFFFFFF) || 0xaaaaaa })
                    );
                    const m = [parseFloat(cf.querySelector('R00').textContent), parseFloat(cf.querySelector('R10').textContent), parseFloat(cf.querySelector('R20').textContent), 0,
                              parseFloat(cf.querySelector('R01').textContent), parseFloat(cf.querySelector('R11').textContent), parseFloat(cf.querySelector('R21').textContent), 0,
                              parseFloat(cf.querySelector('R02').textContent), parseFloat(cf.querySelector('R12').textContent), parseFloat(cf.querySelector('R22').textContent), 0,
                              parseFloat(cf.querySelector('X').textContent), parseFloat(cf.querySelector('Y').textContent), parseFloat(cf.querySelector('Z').textContent), 1];
                    mesh.applyMatrix4(new THREE.Matrix4().fromArray(m));
                    modelGroup.add(mesh);
                }
            });
        }

        function parseTDW(data) {
            try {
                const world = JSON.parse(data);
                world.objects.forEach(obj => {
                    const mesh = new THREE.Mesh(new THREE.BoxGeometry(obj.s[0], obj.s[1], obj.s[2]), new THREE.MeshStandardMaterial({ color: obj.c }));
                    mesh.position.set(obj.p[0], obj.p[1], obj.p[2]);
                    mesh.rotation.set(obj.r[0], obj.r[1], obj.r[2]);
                    modelGroup.add(mesh);
                });
            } catch(e) { console.error("Erreur parsing .tdw"); }
        }

        function focusModel() {
            const box = new THREE.Box3().setFromObject(modelGroup);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            controls.target.copy(center);
            camera.position.set(center.x + maxDim, center.y + maxDim, center.z + maxDim);
            controls.update();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
