<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data:; connect-src 'none';">
    <title>BuildyPopupMaker</title>
    <style>
        :root { --bg: #0f0f12; --panel: #1a1a1f; --accent: #47ff78; --text: #e0e0e0; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: var(--panel); padding: 10px 20px; display: flex; justify-content: space-between; border-bottom: 2px solid var(--accent); align-items: center; }
        .main { display: flex; flex: 1; padding: 10px; gap: 10px; overflow: hidden; }
        textarea { flex: 1; background: #1e1e1e; color: #75beff; border: 1px solid #333; padding: 15px; font-family: 'Consolas', monospace; resize: none; border-radius: 5px; outline: none; }
        #preview { flex: 1; background: white; color: black; border-radius: 5px; overflow-auto; padding: 20px; border: 5px solid #333; }
        .controls { display: flex; gap: 10px; align-items: center; }
        button { background: var(--accent); color: #000; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { opacity: 0.8; }
        select { background: #333; color: white; border: none; padding: 5px; border-radius: 4px; }

        /* Animations */
        @keyframes vibrate {
            0% { transform: translate(1px, 1px); }
            25% { transform: translate(-1px, -1px); }
            50% { transform: translate(1px, -1px); }
            75% { transform: translate(-1px, 1px); }
            100% { transform: translate(1px, 1px); }
        }
        .vibrate-class { display: inline-block; animation: vibrate var(--speed) infinite linear; }
        .security-alert { color: red; font-weight: bold; text-decoration: underline; }
        .wait-tag { color: #666; font-style: italic; border: 1px dashed #ccc; padding: 2px; display: block; margin: 5px 0; }
    </style>
</head>
<body>

<header>
    <div class="controls">
        <strong style="color: var(--accent);">BuildyPopupMaker</strong>
        <select id="langSelect" onchange="updateLang()">
            <option value="fr">FR 🇫🇷</option>
            <option value="en">EN 🇬🇧</option>
        </select>
    </div>
    <div class="controls">
        <button id="btnSave" onclick="startSaveProcess()">💾 SAUVEGARDER (.htmlbp)</button>
        <button id="btnRun" onclick="render()">🚀 ACTUALISER</button>
    </div>
</header>

<div class="main">
    <textarea id="editor" oninput="render()" spellcheck="false"><vibrate-text intensity="3" speed="50">SYSTEM OVERLOAD</vibrate-text>
<p>Initializing Buildy Engine...</p>
<wait-seconds value="3"></wait-seconds>
<p>Check complete.</p>
<close-window-auto></close-window-auto></textarea>
    <div id="preview"></div>
</div>

<script>
    const i18n = {
        fr: {
            folderPrompt: "Nom du dossier dans Maps :",
            folderCreate: "Dossier inexistant. Créer un nouveau dossier ?",
            filePrompt: "Nom du fichier (sans .htmlbp) :",
            overwrite: "Fichier déjà existant. Remplacer ?",
            saveSuccess: "Fichier enregistré : ",
            security: "[SÉCURITÉ : URL BLOQUÉE]"
        },
        en: {
            folderPrompt: "Folder name in Maps:",
            folderCreate: "Folder not found. Create it?",
            filePrompt: "File name (without .htmlbp):",
            overwrite: "File exists. Overwrite?",
            saveSuccess: "File saved: ",
            security: "[SECURITY: URL BLOCKED]"
        }
    };

    let currentLang = 'fr';

    function updateLang() {
        currentLang = document.getElementById('langSelect').value;
        const btn = document.getElementById('btnSave');
        btn.innerText = currentLang === 'fr' ? "💾 SAUVEGARDER (.htmlbp)" : "💾 SAVE (.htmlbp)";
        render();
    }

    async function startSaveProcess() {
        if (!window.pywebview || !window.pywebview.api) return;
        
        const t = i18n[currentLang];
        const content = document.getElementById('editor').value;

        let folder = prompt(t.folderPrompt);
        if (!folder) return;

        let check = await pywebview.api.check_folder(folder);
        if (!check.exists) {
            if (confirm(t.folderCreate)) {
                await pywebview.api.create_folder(folder);
            } else { return; }
        }

        let filename = prompt(t.filePrompt);
        if (!filename) return;
        filename = filename.replace(".htmlbp", "");

        let result = await pywebview.api.save_file(folder, filename, content);
        
        if (result.status === "exists") {
            if (confirm(t.overwrite)) {
                await pywebview.api.force_save(folder, filename, content);
                alert(t.saveSuccess + filename);
            }
        } else if (result.status === "success") {
            alert(t.saveSuccess + filename);
        }
    }

    function render() {
        let code = document.getElementById('editor').value;
        const preview = document.getElementById('preview');

        // Sécurité URLs
        code = code.replace(/https?:\/\/[^\s"']+/g, `<span class="security-alert">${i18n[currentLang].security}</span>`);

        // Balises de temps
        code = code.replace(/<wait-(seconds|minutes|hours|days) value="(\d+)">/g, (m, unit, val) => {
            return `<div class="wait-tag">⏳ Attente : ${val} ${unit}</div>`;
        });

        // Fermeture auto
        code = code.replace(/<close-window-auto>/g, `<div style="color:red; border:1px solid red; padding:5px; font-size:10px;">AUTO-CLOSE TRIGGER</div>`);

        preview.innerHTML = code;
        
        // Moteur de vibration
        preview.querySelectorAll('vibrate-text').forEach(el => {
            const speed = el.getAttribute('speed') || 100;
            const intensity = el.getAttribute('intensity') || 2;
            const wrapper = document.createElement('span');
            wrapper.className = 'vibrate-class';
            wrapper.style.setProperty('--speed', speed + 'ms');
            wrapper.innerHTML = el.innerHTML;
            el.replaceWith(wrapper);
        });
    }

    window.onload = render;
</script>
</body>
</html>
